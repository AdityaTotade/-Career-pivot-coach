# Every morning: refresh 4 roles of job postings (~20 Firecrawl credits), test, commit, redeploy.
# Needs repository secrets FIRECRAWL_API_KEY and VERCEL_TOKEN (Settings > Secrets and variables > Actions).
name: Daily job-posting refresh

on:
  # Daily schedule switched off after the hackathon (2026-11-01). To turn it back on, restore:
  #   schedule:
  #     - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      VERCEL_ORG_ID: team_2DGNtCWhEfIsytnwa9BKPMuQ
      VERCEL_PROJECT_ID: prj_NMw3eQYtsnmZ8Vq6TzFUzImQCcXx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's roles from Naukri
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python tools/refresh_corpus.py

      - name: Test (stop here if the new data breaks anything)
        run: python -m unittest

      - name: Commit new postings
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add corpus
          git diff --cached --quiet && echo "no new postings" || git commit -m "Daily refresh: $(date -u +%F)"
          git push

      - name: Redeploy the site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python tools/build_deploy.py
          cd active/deploy
          npx --yes vercel@65.9.0 deploy --prod --yes --token "$VERCEL_TOKEN"
